syntax = "proto3";

package pb;

option go_package = "github.com/Chroq/benchmark-caching/internal/infrastructure/serializer/pb";

message UserDataProto {
  bytes id = 1;
  string first_name = 2;
  string last_name = 3;
  int64 birth_date = 4;
  bool active = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  int64 deleted_at = 8;
}
